name: peers-interop

# Interop against real open-source LwM2M clients (Wakaama, Anjay, Anjay Lite)
# built from pinned upstream sources inside the image; see interop/peers/README.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * *" # nightly

permissions:
  contents: read

concurrency:
  group: peers-interop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  peers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The peer stages (mbedTLS, Wakaama, Anjay, Anjay Lite) change only when
      # their pins do; the GitHub Actions cache keeps them across runs.
      - name: build peers image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: interop/peers/Dockerfile
          target: test
          tags: lwm2m-peers-test
          load: true
          cache-from: type=gha,scope=peers
          cache-to: type=gha,scope=peers,mode=max
      - name: interop tests
        run: |
          docker run --rm lwm2m-peers-test \
            /usr/local/bin/peers.test -test.v -test.count=1 -test.timeout=30m 2>&1 | tee peers.log
          exit "${PIPESTATUS[0]}"
      - name: summary
        if: always()
        run: |
          {
            echo '### LwM2M peer interop'
            echo '```'
            grep -E '^(--- |    --- |ok|FAIL|PASS)' peers.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peers-log
          path: peers.log
