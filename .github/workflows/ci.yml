name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # nightly race stress run

permissions:
  contents: read

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test persistent container
        shell: bash
        run: |
          set -euo pipefail
          image=lwm2md-smoke:local
          volume="lwm2md-smoke-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}"
          container="lwm2md-smoke-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}"
          keys=$(mktemp "$PWD/.container-smoke-keys.XXXXXX")
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
            rm -f "$keys"
          }
          trap cleanup EXIT
          test_token=lwm_smoke_synthetic
          digest=$(printf %s "$test_token" | sha256sum | cut -d ' ' -f 1)
          printf 'key_smoke sha256:%s devices:read,devices:write\n' "$digest" > "$keys"
          chmod 644 "$keys"
          docker build -t "$image" .
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" != 0
          test -n "$(docker image inspect --format '{{.Config.User}}' "$image")"
          docker volume create "$volume" >/dev/null
          start() {
            docker run -d --name "$container" -p 127.0.0.1::8080 \
              -v "$volume:/data" -v "$keys:/run/keys:ro" "$image" \
              -store sqlite:/data/devices.db -api-keys /run/keys >/dev/null
            port=$(docker port "$container" 8080/tcp | sed 's/.*://')
            url="http://127.0.0.1:$port"
            for _ in $(seq 1 60); do
              if curl -fsS "$url/readyz" >/dev/null 2>&1; then return; fi
              sleep 1
            done
            docker logs "$container"
            return 1
          }
          start
          test "$(docker exec "$container" id -u)" = 10001
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$url/v1/devices" \
            -H "Authorization: Bearer $test_token" -H 'Content-Type: application/json' \
            -d '{"endpoint":"container-smoke"}')
          test "$status" = 201
          docker stop "$container" >/dev/null
          docker rm "$container" >/dev/null
          start
          curl -fsS -H "Authorization: Bearer $test_token" "$url/v1/devices/container-smoke" |
            python3 -c 'import json,sys; assert json.load(sys.stdin)["endpoint"] == "container-smoke"'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "unformatted:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race -count=1 ./...
      - name: spec coverage
        run: |
          go test -count=1 -v -run TestSpecCoverage . | tee coverage.txt
          # Only requirements blocked on an upstream dependency may stay
          # pending, and each must say so; anything else is a gap.
          if grep -v '^#' spec/coverage-pending.txt | grep -v '^\s*$' | grep -vq 'upstream'; then
            echo "pending requirements without an upstream blocker:"
            grep -v '^#' spec/coverage-pending.txt | grep -v '^\s*$' | grep -v 'upstream'
            exit 1
          fi

  race-stress:
    # Repeats the concurrency-heavy packages under the race detector to
    # surface rare races (one was seen once under load and not reproduced).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=20 ./server ./transport/coap ./bootstrap ./fota ./transport/mqtt ./leshanapi

  consumer:
    # Builds a throwaway module that requires this commit, importing every
    # public package. Go ignores replace directives outside the main module,
    # so one in our go.mod would pass the jobs above and break every user.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./scripts/consumer-build.sh
